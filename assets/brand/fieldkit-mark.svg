<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="FieldKit mark">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1A2530" stroke-width="1"/>
    </pattern>
    <radialGradient id="warm" cx="50%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#FFB000" stop-opacity=".22"/>
      <stop offset="62%" stop-color="#FFB000" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#FFB000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4BE3D0" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#4BE3D0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile">
      <rect x="8" y="8" width="496" height="496" rx="104"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="496" height="496" rx="104" fill="#0B0E12"/>
    <rect x="8" y="8" width="496" height="496" fill="url(#grid)" opacity=".72"/>
    <circle cx="256" cy="250" r="214" fill="url(#warm)"/>
    <circle cx="256" cy="246" r="168" fill="url(#cool)"/>

    <g fill="none" stroke="#4BE3D0" stroke-linecap="round">
      <circle cx="256" cy="246" r="151" opacity=".20"/>
      <circle cx="256" cy="246" r="118" opacity=".08"/>
      <path d="M256 60v62M256 370v62M70 246h62M380 246h62" opacity=".42" stroke-width="2"/>
      <path d="M256 78v28M256 386v28M88 246h28M396 246h28" opacity=".75" stroke-width="1"/>
    </g>

    <g filter="url(#glow)" transform="translate(40 48) scale(4)">
      <path fill="#FFB000" d="M54,18 C51,27 44,33 44,45 C44,56 48,63 54,69 C60,63 64,56 64,45 C64,38 61,34 58,29 C58,36 56,39 54,42 C55,34 55,25 54,18 Z"/>
      <path fill="#FFD27A" d="M54,41 C52,47 50,50 50,55 C50,60 52,63 54,66 C56,63 58,60 58,55 C58,50 56,46 54,41 Z"/>
      <path fill="none" stroke="#FFB000" stroke-width="5" stroke-linecap="round" d="M43,76 L65,95"/>
      <path fill="none" stroke="#FFB000" stroke-width="5" stroke-linecap="round" d="M65,76 L43,95"/>
    </g>

    <circle cx="256" cy="246" r="3.5" fill="#4BE3D0" opacity=".9"/>
    <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2A3440" stroke-width="2"/>
  </g>
</svg>
